<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Skhroma banner</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080c; }
  body {
    position: relative;
    font-family: Inter, "Segoe UI", sans-serif;
    color: #e9e4d8;
    background:
      radial-gradient(ellipse 900px 420px at 50% 78%, rgba(255,110,30,0.16), transparent 70%),
      radial-gradient(ellipse 1200px 600px at 50% 0%, rgba(60,90,160,0.22), transparent 70%),
      linear-gradient(#0b0d14, #06070a);
  }
  #snow { position: absolute; inset: 0; }
  header { position: absolute; top: 92px; width: 100%; text-align: center; }
  h1 { display: inline-block;
    margin: 0;
    font-family: Cinzel, Georgia, serif; font-weight: 700;
    font-size: 150px; letter-spacing: 34px; padding-left: 34px;
    background: linear-gradient(90deg, #4f86ff 0%, #e8333a 38%, #ff8a2a 62%, #3fdc6a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(255,120,60,0.35));
  }
  .tag {
    margin-top: 6px;
    font-family: Cinzel, Georgia, serif; font-weight: 500;
    font-size: 34px; letter-spacing: 9px; color: #d9d2c2; text-transform: uppercase;
  }
  .rule { width: 520px; height: 1px; margin: 26px auto 0;
    background: linear-gradient(90deg, transparent, #c9a45c, transparent); }
  #kb { position: absolute; left: 50%; top: 400px; transform: translateX(-50%); }
  .plate {
    position: absolute; border-radius: 26px;
    background: linear-gradient(#16181f, #0d0e13);
    box-shadow: 0 40px 120px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .key {
    position: absolute; box-sizing: border-box; border-radius: 9px;
    font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.88);
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 7px 9px; letter-spacing: 0.5px;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
  }
  .glow { position: absolute; left: 50%; top: 935px; transform: translateX(-50%);
    width: 1500px; height: 60px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,120,40,0.35), transparent 70%); filter: blur(10px); }
  footer { position: absolute; bottom: 38px; width: 100%; text-align: center;
    font-size: 24px; letter-spacing: 3px; color: #b8b1a3; }
  footer b { color: #f0c77a; font-weight: 600; }
  footer span { margin: 0 18px; color: #5d5a54; }
</style>
</head>
<body>
<canvas id="snow" width="1920" height="1080"></canvas>
<header>
  <h1>SKHROMA</h1>
  <div class="tag">Chroma lighting that lives in Skyrim</div>
  <div class="rule"></div>
</header>
<div class="glow"></div>
<div id="kb"></div>
<footer>
  <b>Health · Magicka · Stamina</b><span>◆</span>Weather &amp; time of day<span>◆</span>Combat<span>◆</span>SunHelm<span>◆</span>No ESP
</footer>
<script>
const U = 64, GAP = 6, PAD = 26;
const C = {
  health: [220, 24, 30], magicka: [40, 100, 255], stamina: [40, 215, 80],
  combat: [255, 95, 20], gold: [255, 196, 60], torch: [62, 26, 8],
  hunger: [230, 140, 40], thirst: [40, 190, 255], fatigue: [170, 90, 255], cold: [170, 235, 255],
};
const keys = []; // [label, x, y, w, h]
function row(y, items, x0 = 0) {
  let x = x0;
  for (const it of items) {
    const [label, w = 1] = Array.isArray(it) ? it : [it];
    if (label !== null) keys.push([label, x, y, w, 1]);
    x += w;
  }
}
row(0, ["Esc", [null, 1], "F1","F2","F3","F4", [null,.5], "F5","F6","F7","F8", [null,.5], "F9","F10","F11","F12"]);
row(1.25, ["`","1","2","3","4","5","6","7","8","9","0","-","=",["Back",2]]);
row(2.25, [["Tab",1.5],"Q","W","E","R","T","Y","U","I","O","P","[","]",["\\",1.5]]);
row(3.25, [["Caps",1.75],"A","S","D","F","G","H","J","K","L",";","'",["Enter",2.25]]);
row(4.25, [["Shift",2.25],"Z","X","C","V","B","N","M",",",".","/",["Shift",2.75]]);
row(5.25, [["Ctrl",1.25],["Win",1.25],["Alt",1.25],["",6.25],["Alt",1.25],["Fn",1.25],["Menu",1.25],["Ctrl",1.25]]);
const NX = 15.5;
row(1.25, ["Num","/","*","−"], NX);
row(2.25, ["7","8","9"], NX); keys.push(["+", NX+3, 2.25, 1, 2]);
row(3.25, ["4","5","6"], NX);
row(4.25, ["1","2","3"], NX); keys.push(["Ent", NX+3, 4.25, 1, 2]);
row(5.25, [["0",2],"."], NX);

const W = (NX + 4) * U, H = 6.25 * U;
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const scale = (a, s) => a.map(v => v * s);

function colorFor(label, x, y, w) {
  const cx = (x + w / 2) * U, cy = (y + 0.5) * U;
  // ambient: dim torchlight with combat embers burning in from the plate edges
  const edge = Math.min(cx, W - cx, cy * 1.6, (H - cy) * 1.6);
  const ember = Math.max(0, 1 - edge / 190) ** 1.6;
  const flicker = 0.85 + 0.15 * Math.sin(cx * 0.05 + cy * 0.11);
  let col = mix(scale(C.torch, flicker), C.combat, ember * 0.6);

  const fbar = (start, color, fill) => {
    const i = ["F1","F2","F3","F4","F5","F6","F7","F8","F9","F10","F11","F12"].indexOf(label) - start;
    if (i < 0 || i > 3) return null;
    const f = Math.max(0, Math.min(1, fill - i));
    return mix(scale(color, 0.08), color, f);
  };
  col = fbar(0, C.magicka, 4) || fbar(4, C.health, 2.6) || fbar(8, C.stamina, 3.3) || col;
  if (y >= 1.25 && y < 5 && ["W","A","S","D"].includes(label)) col = C.combat;
  if (label === "Z") col = C.gold;
  if (label === "Esc") col = C.health;

  if (x >= NX) { // SunHelm meters, one per column, filling from the bottom
    const colIdx = Math.round(x - NX);
    const meters = [[C.hunger, 3], [C.thirst, 2], [C.fatigue, 4], [C.cold, 2]];
    const [mc, lvl] = meters[Math.min(colIdx, 3)];
    const fromBottom = Math.round(5.25 - y) + 1; // 1..5
    col = fromBottom <= lvl ? mc : scale(mc, 0.07);
    if (label === "0") col = fromBottom <= meters[0][1] ? C.hunger : col;
  }
  return col;
}

const kb = document.getElementById("kb");
kb.style.width = (W + PAD * 2) + "px"; kb.style.height = (H + PAD * 2) + "px";
const plate = document.createElement("div");
plate.className = "plate";
Object.assign(plate.style, { left: 0, top: 0, width: (W + PAD * 2) + "px", height: (H + PAD * 2) + "px" });
kb.appendChild(plate);

for (const [label, x, y, w, h] of keys) {
  const c = colorFor(label, x, y, w).map(v => Math.round(Math.max(0, Math.min(255, v))));
  const lum = (c[0] + c[1] + c[2]) / 765;
  const el = document.createElement("div");
  el.className = "key";
  el.textContent = label;
  Object.assign(el.style, {
    left: (PAD + x * U) + "px", top: (PAD + y * U) + "px",
    width: (w * U - GAP) + "px", height: (h * U - GAP) + "px",
    background: `linear-gradient(160deg, rgba(${c},0.95), rgba(${c.map(v => v * 0.55)},0.95))`,
    border: `1px solid rgba(${c.map(v => Math.min(255, v + 60))},0.55)`,
    boxShadow: `0 0 ${10 + lum * 30}px rgba(${c},${0.25 + lum * 0.55}), inset 0 -4px 0 rgba(0,0,0,0.35)`,
    color: lum < 0.06 ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.9)",
  });
  kb.appendChild(el);
}

// snowfall + embers
const ctx = document.getElementById("snow").getContext("2d");
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 260; i++) {
  const x = rnd() * 1920, y = rnd() * 1080, r = 0.6 + rnd() * 2.2;
  ctx.fillStyle = `rgba(210,225,255,${0.12 + rnd() * 0.45})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
for (let i = 0; i < 70; i++) {
  const x = 200 + rnd() * 1520, y = 760 + rnd() * 300, r = 0.8 + rnd() * 2;
  ctx.fillStyle = `rgba(255,${120 + rnd() * 80},40,${0.25 + rnd() * 0.5})`;
  ctx.shadowColor = "rgba(255,120,30,0.9)"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
</script>
</body>
</html>
