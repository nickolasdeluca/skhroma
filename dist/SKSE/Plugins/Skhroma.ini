; Skhroma - Razer Chroma integration for Skyrim
; Booleans: 1/0, true/false. Colors: RRGGBB hex.

[General]
bEnabled = 1
; Lighting frame rate (5-60). 30 is plenty for Chroma devices.
iFPS = 30
; How often game state is read on the main thread, in milliseconds.
iSampleIntervalMs = 66
; Global brightness multiplier (0.0-1.0).
fBrightness = 1.0
; Brightness of the ambient layer (time of day, weather, torchlight).
fAmbientBrightness = 0.35

[Devices]
bKeyboard = 1
bMouse = 1
bMousepad = 1
bHeadset = 1
bKeypad = 1
bChromaLink = 1

[Thresholds]
; Fractions of the maximum value that count as "low".
fLowHealth = 0.30
fLowMagicka = 0.20
fLowStamina = 0.20

[Effects]
; Time of day / weather / interior torchlight base layer.
bAmbient = 1
; Magicka (F1-F4), Health (F5-F8), Stamina (F9-F12); mouse side strips; mousepad ring.
bAttributeBars = 1
; Heartbeat pulse on every device when health is low.
bLowHealthPulse = 1
; Red flash when hit, blue-white flash when blocking.
bDamageFlash = 1
; Embers burning in from the edges while in combat; WASD turn combat colored.
bCombat = 1
; SunHelm meters on the numpad (hunger, thirst, fatigue, cold) and keypad.
bSurvival = 1
; SunHelm cold: frost creeps in from the edges as you freeze.
bCold = 1
; Clouds, rain drops, snow flakes.
bWeather = 1
; Random lightning flashes during thunderstorms.
bLightning = 1
; Shout key (Z): dim while recovering, gold when ready.
bShout = 1
bSneak = 1
bWater = 1
; Werewolf, Vampire Lord and vampire tints.
bTransformations = 1
bLevelUp = 1
bDragonSoul = 1
; Dim lights in menus; special looks for map, lockpicking and sleep/wait.
bMenus = 1
bDeath = 1

[Colors]
sHealth = D01010
sMagicka = 1050FF
sStamina = 20D040
sFrost = 9FE8FF
sCombat = FF5A10
